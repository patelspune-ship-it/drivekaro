<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4e8d0">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon-steering.png">
<title>DriveKaro AI Marketer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=Mukta:wght@500;700;800&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{
  --bg:#F4E8D0; --surface:#FFFAF4; --surface-2:#EDE3D5; --ink:#1A120C; --muted:#6E5C4C; --line:#D6C8B2;
  --accent:#B5382A; --accent-ink:#FFFFFF; --accent-soft:#F3DCD4;
  --ok:#2A7A4B; --ok-soft:#DFF0E5; --warn:#9A6412; --warn-soft:#F7EAD2; --bad:#B0281F; --bad-soft:#F6DEDB; --info:#2C5A96; --info-soft:#DDE7F4;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#0E1719; --surface:#152124; --surface-2:#1C2B2F; --ink:#E3ECEA; --muted:#94A6A3; --line:#2A3B3F;
    --accent:#E4796A; --accent-ink:#1A0C09; --accent-soft:#3A1E1A; --ok:#6FCB93; --ok-soft:#173226; --warn:#E3B25C; --warn-soft:#3A2D14; --bad:#F08A80; --bad-soft:#3D1D1A; --info:#8DB4EC; --info-soft:#1A2A40; }
}
:root[data-theme="dark"]{ color-scheme:dark; --bg:#0E1719; --surface:#152124; --surface-2:#1C2B2F; --ink:#E3ECEA; --muted:#94A6A3; --line:#2A3B3F; --accent:#E4796A; --accent-ink:#1A0C09; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;font:800 17px var(--f-display)}
.brand img{height:26px}
.brand span{font:600 13px var(--f-body);color:var(--muted)}
nav.tabs{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto;position:sticky;top:0;z-index:5}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--accent-soft);color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:16px}
h3{font:700 16px var(--f-display);margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h3:not(:first-child){margin-top:18px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.actions.sticky{position:sticky;bottom:0;background:var(--surface);padding:10px 0;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;font:600 14px var(--f-body);cursor:pointer}
.btn:hover{border-color:var(--muted)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}.btn[disabled]{opacity:.5;cursor:not-allowed}.btn.sm{padding:6px 10px;font-size:13px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
.muted{color:var(--muted)}.small{font-size:13px}.big{font:800 22px var(--f-display)}
.err{color:var(--bad)}.warnline{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:8px;font-size:13.5px}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok,.chip.st-posted{background:var(--ok-soft);color:var(--ok)}.chip.bad,.chip.st-failed{background:var(--bad-soft);color:var(--bad)}
.chip.warn,.chip.st-partial{background:var(--warn-soft);color:var(--warn)}.chip.info,.chip.st-approved{background:var(--info-soft);color:var(--info)}
.monthbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px;font:700 18px var(--f-display)}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}.empty h3{color:var(--ink)}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.post{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.post.past{opacity:.62}
.thumb{flex:0 0 112px;height:140px;border:0;padding:0;border-radius:8px;overflow:hidden;background:var(--surface-2);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pbody{flex:1;min-width:0}.pdate{font:700 14px var(--f-display)}
.ptype{color:var(--muted);font-size:12.5px;margin-top:2px}.phead{font-weight:600;margin:4px 0 6px;overflow-wrap:anywhere}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.pchip.on{border-color:var(--accent);color:var(--ink)}.pchip.done{background:var(--ok-soft);border-color:var(--ok)}.pchip.bad{background:var(--bad-soft);border-color:var(--bad)}
.pchip input[type=checkbox]{margin:0;accent-color:var(--accent)}.pchip input[type=color]{width:28px;height:22px;border:0;padding:0;background:none}
.field{margin-bottom:10px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--muted)}
.field input:not([type=checkbox]):not([type=color]),.field select,.field textarea,#up_files{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:15px var(--f-body)}
textarea{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.small{display:block;margin:6px 0}
.editor .edgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:12px}
.preview{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;justify-content:center}
.preview canvas{max-width:100%;max-height:72vh;height:auto;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.seg{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:6px 10px;font:600 13px var(--f-body);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.phgrid{display:flex;flex-wrap:wrap;gap:6px}
.phpick{width:64px;height:64px;border:2px solid transparent;border-radius:8px;overflow:hidden;padding:0;background:var(--surface-2);cursor:pointer;color:var(--muted);font:600 12px var(--f-body)}
.phpick img{width:100%;height:100%;object-fit:cover;display:block}.phpick.on{border-color:var(--accent)}
.aibox{display:flex;gap:8px;margin:-4px 0 10px}.aibox input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.ev{display:grid;grid-template-columns:112px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ev.hid{opacity:.45}.ev.hid strong{text-decoration:line-through}.evd{font:700 13.5px var(--f-display)}
.lw{padding:6px 0;border-top:1px solid var(--line)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gallery figure{margin:0;background:var(--surface-2);border-radius:10px;overflow:hidden}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.gallery figcaption{display:flex;flex-wrap:wrap;gap:4px;padding:6px}.gallery select{flex:1;min-width:0;font-size:12px;padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.conn{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#banner{background:var(--bad-soft);color:var(--bad);padding:8px 16px;font-weight:600}
.gate{max-width:360px;margin:12vh auto;padding:0 16px}.gate img{height:42px;margin-bottom:10px}
@media (max-width:760px){
  .editor .edgrid{grid-template-columns:1fr}.two{grid-template-columns:1fr}
  .posts{grid-template-columns:1fr}.ev{grid-template-columns:1fr auto}.ev .evd{grid-column:1/-1}
  .thumb{flex-basis:96px;height:120px}
}
</style>
</head>
<body>
<div id="gate" class="gate" hidden>
  <img src="/logo-transparent.png" alt="DriveKaro">
  <h3>AI Marketer</h3>
  <p class="muted small">Sign in with your desk owner account.</p>
  <form id="gateform" class="card">
    <div class="field"><label for="g_email">Email</label><input id="g_email" type="email" autocomplete="username"></div>
    <div class="field"><label for="g_pass">Password</label><input id="g_pass" type="password" autocomplete="current-password"></div>
    <p id="g_err" class="err small"></p>
    <button id="g_btn" class="btn primary" type="submit">Sign in</button>
  </form>
</div>
<div id="main" hidden>
  <header><div class="brand"><img src="/logo-transparent.png" alt="DriveKaro"> <span>AI Marketer</span></div><div class="row"><span id="who" class="muted small"></span><button id="signout" class="btn sm">Sign out</button></div></header>
  <nav class="tabs"><button class="tab on" data-tab="plan">Plan</button><button class="tab" data-tab="calendar">Holidays</button><button class="tab" data-tab="photos">Photos</button><button class="tab" data-tab="brand">Brand &amp; connections</button></nav>
  <div id="banner" hidden></div>
  <main id="app"></main>
</div>
<div id="toast" hidden></div>
<script type="module" src="/src/marketer/main.js"></script>
</body>
</html>
